name: Deploy Mocha Muse to Firebase

on:
  push:
    branches: [main, claude/confident-curie-hq332o]
    paths:
      - "mocha-muse/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy key is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROWNIQUE_ART }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_BROWNIQUE_ART repository secret first (see mocha-muse/README.md, 'Deploying')."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy hosting and Firestore rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROWNIQUE_ART }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13.35.1 deploy --only hosting,firestore:rules --project brownique-art --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Site address
        run: echo "Live at https://brownique-art.web.app" >> "$GITHUB_STEP_SUMMARY"
